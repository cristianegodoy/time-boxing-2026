  /* ═══════════════════════════════════════════════════════════════
     FIREBASE CROSS-BROWSER SYNC — Time Boxing 2026 · Chrissy G.
     ───────────────────────────────────────────────────────────────
     CONFIGURAÇÃO (uma única vez):
       1. Acesse console.firebase.google.com
       2. Crie um projeto → Realtime Database → Iniciar em modo de teste
       3. Copie a URL do banco (ex: https://meu-projeto-rtdb.firebaseio.com)
       4. Cole abaixo no lugar de SEU-PROJETO-default-rtdb
     ═══════════════════════════════════════════════════════════════ */
  (function () {
    var FB_BASE = 'https://timebox-chrissy-default-rtdb.firebaseio.com/cg';
    var SYNC_KEYS = ['cg_blocks_v4', 'cg_cards_v4', 'cg_selected_v4', 'cg_seed_v'];
    var IS_CONFIGURED = FB_BASE.indexOf('SEU-PROJETO') === -1;

    /* ── guarda o setItem original antes de qualquer override ── */
    var _rawSet = Storage.prototype.setItem;

    if (!IS_CONFIGURED) {
      /* Firebase não configurado: só usa localStorage normalmente */
      return;
    }

    /* ── LEITURA: sincroniza DO Firebase ANTES do React ler o localStorage ──
       XHR síncrono garante que os dados estão prontos antes do bundle executar  */
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', FB_BASE + '.json', false); /* false = síncrono */
      xhr.send();
      if (xhr.status === 200) {
        var remote = JSON.parse(xhr.responseText);
        if (remote && typeof remote === 'object') {
          SYNC_KEYS.forEach(function (key) {
            if (remote[key] != null) {
              _rawSet.call(localStorage, key, remote[key]);
            }
          });
        }
      }
    } catch (e) {
      /* offline ou Firebase indisponível: usa dados locais sem quebrar */
    }

    /* ── ESCRITA: intercepta o setItem e espelha para o Firebase ──
       Debounce de 400ms evita chamadas excessivas durante edição  */
    var _timers = {};
    Storage.prototype.setItem = function (key, value) {
      _rawSet.call(this, key, value);
      if (this !== localStorage || SYNC_KEYS.indexOf(key) === -1) return;
      clearTimeout(_timers[key]);
      _timers[key] = setTimeout(function () {
        fetch(FB_BASE + '/' + key + '.json', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(value)
        }).catch(function () { /* silencioso: não quebra o app */ });
      }, 400);
    };

    /* ── Indicador visual de sync (canto inferior direito) ── */
    var dot = document.createElement('div');
    dot.id = 'sync-dot';
    dot.title = 'Firebase sync ativo';
    dot.style.cssText = [
      'position:fixed', 'bottom:14px', 'right:14px', 'width:7px', 'height:7px',
      'border-radius:50%', 'background:#7BC67E', 'opacity:0.7',
      'z-index:9999', 'transition:opacity 0.3s', 'cursor:default',
      'box-shadow:0 0 0 2px rgba(123,198,126,0.25)'
    ].join(';');
    document.addEventListener('DOMContentLoaded', function () {
      document.body.appendChild(dot);
    });

    /* pisca ao salvar */
    var _origSet2 = Storage.prototype.setItem;
    Storage.prototype.setItem = function (key, value) {
      _origSet2.call(this, key, value);
      if (this === localStorage && SYNC_KEYS.indexOf(key) !== -1) {
        dot.style.opacity = '1';
        dot.style.background = '#7BC67E';
        setTimeout(function () { dot.style.opacity = '0.45'; }, 600);
      }
    };
  })();
  </script>
